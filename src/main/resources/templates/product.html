<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Товар — PriceTracker</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main>
    <header>
        <div>
            <h1 th:text="${product.title}">Товар</h1>
            <div class="muted" th:text="${product.url}"></div>
        </div>
        <a th:href="@{/}"><button class="secondary">← К списку</button></a>
    </header>

    <p class="muted" th:if="${message}" th:text="${message}"></p>

    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
            <h2>График цены (по дням)</h2>
            <form method="post" th:action="@{/web/products/{id}/poll(id=${product.id})}">
                <button type="submit">Опросить сейчас</button>
            </form>
        </div>
        <div class="chart" th:utext="${chartSvg}"></div>
    </div>

    <div class="card">
        <h2>Алерты товара</h2>
        <p class="muted" th:if="${alerts.isEmpty()}">Алертов нет.</p>
        <div th:each="a : ${alerts}" style="display:flex;gap:12px;align-items:center;padding:8px 0">
            <span class="badge" th:text="'↓ ' + ${a.price} + ' ₽'"></span>
            <span th:text="'Порог ' + ${a.threshold} + ' ₽'"></span>
            <form method="post" th:action="@{/web/alerts/{id}/read(id=${a.id})}" style="margin-left:auto">
                <button class="secondary" type="submit">Прочитано</button>
            </form>
        </div>
    </div>

    <div class="card">
        <h2>Последние снимки</h2>
        <table>
            <thead><tr><th>Время</th><th>Цена</th><th>Провайдер</th></tr></thead>
            <tbody>
            <tr th:each="s : ${snapshots}">
                <td th:text="${s.capturedAt}"></td>
                <td th:text="${s.price + ' ' + s.currency}"></td>
                <td th:text="${s.provider}"></td>
            </tr>
            </tbody>
        </table>
        <p class="muted" th:if="${snapshots.isEmpty()}">Снимков пока нет.</p>
    </div>
</main>
</body>
</html>
