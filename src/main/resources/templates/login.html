<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход — PriceTracker</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main>
    <div class="card" style="max-width:440px;margin:80px auto">
        <h1>Вход</h1>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form method="post" th:action="@{/login}">
            <div style="margin-bottom:12px">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" value="demo@example.com" required>
            </div>
            <div style="margin-bottom:12px">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" value="demopass123" required>
            </div>
            <button type="submit">Войти</button>
        </form>
        <p class="muted">Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
    </div>
</main>
</body>
</html>
