<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" id="theme-color" content="#f6f7fb">
    <title>Вход — PriceTracker</title>
    <script th:inline="none">
        try {
            var saved = localStorage.getItem('theme');
            if (saved !== 'light' && saved !== 'dark') {
                saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = saved;
        } catch (e) {
            document.documentElement.dataset.theme = 'light';
        }
    </script>
    <link rel="stylesheet" th:href="@{/style.css}">
    <script th:src="@{/theme.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/theme-toggle :: themeToggle}"></div>
<main>
    <div class="card" style="max-width:440px;margin:80px auto">
        <h1>Вход</h1>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form method="post" th:action="@{/login}">
            <div style="margin-bottom:12px">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" value="demo@example.com" required>
            </div>
            <div style="margin-bottom:12px">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" value="demopass123" required>
            </div>
            <button type="submit">Войти</button>
        </form>
        <p class="muted">Регистрация закрыта. Демо-аккаунты: <code>demo@example.com / demopass123</code>, <code>student@example.com / qwerty123</code>.</p>
    </div>
</main>
</body>
</html>
