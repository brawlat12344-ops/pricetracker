<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Сравнение — PriceTracker</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main>
    <div th:replace="~{fragments/header :: header('Сравнение товаров')}"></div>

    <div class="card">
        <h2>Вердикт</h2>
        <p th:text="${result.verdict}"></p>
        <p class="muted" th:text="'Категория: ' + ${result.categoryLabel}"></p>
        <a class="btn secondary" th:href="@{/}">← К списку товаров</a>
    </div>

    <div class="card">
        <h2>Характеристики и цена из карточки</h2>
        <div th:replace="~{fragments/compare-table :: table(${result})}"></div>
    </div>

    <div class="card">
        <h2>Не найденные характеристики</h2>
        <p class="muted" th:if="${result.items[0].missingAttributes.isEmpty()}">Все характеристики распознаны.</p>
        <div th:each="item : ${result.items}">
            <p th:if="${!item.missingAttributes.isEmpty()}">
                <strong th:text="${item.title}"></strong>:
                <span th:text="${item.missingAttributes}"></span>
            </p>
        </div>
    </div>
</main>
</body>
</html>
