<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
<header th:fragment="header(title)">
    <div class="brand">
        <h1 th:text="${title}">Найти дешевле</h1>
        <div class="muted">Та же конфигурация — меньшая цена</div>
    </div>
    <nav class="nav" aria-label="Основная навигация">
        <a th:href="@{/cheaper}" class="active">Найти дешевле</a>
    </nav>
    <form class="logout-form" th:action="@{/logout}" method="post">
        <button class="secondary" type="submit">Выйти</button>
    </form>
</header>
</body>
</html>
