<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
<header th:fragment="header(title)">
    <div class="brand">
        <h1 th:text="${title}">PriceTracker</h1>
        <div class="muted">Цены, история и алерты в одном месте</div>
    </div>
    <nav class="nav" aria-label="Основная навигация">
        <a th:href="@{/}" th:classappend="${activeNav == 'products'} ? 'active' : ''">Товары</a>
        <a th:href="@{/analogs}" th:classappend="${activeNav == 'analogs'} ? 'active' : ''">Поиск аналогов</a>
        <a th:href="@{/cheaper}" th:classappend="${activeNav == 'cheaper'} ? 'active' : ''">Найти дешевле</a>
    </nav>
    <form class="logout-form" th:action="@{/logout}" method="post">
        <button class="secondary" type="submit">Выйти</button>
    </form>
</header>
</body>
</html>
