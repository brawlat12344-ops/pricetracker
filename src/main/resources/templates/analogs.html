<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Поиск аналогов — PriceTracker</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main>
    <div th:replace="~{fragments/header :: header('Поиск аналогов')}"></div>

    <div class="card">
        <h2>Одна ссылка → до 10 аналогов</h2>
        <form method="get" th:action="@{/analogs}">
            <div class="grid">
                <div>
                    <label for="analogUrl">URL товара</label>
                    <input id="analogUrl" name="url" type="url"
                           placeholder="https://shop.example/pc/build-42"
                           th:value="${analogUrl}" required>
                </div>
                <div>
                    <label for="analogCategory">Тема</label>
                    <select id="analogCategory" name="category">
                        <option th:each="c : ${categories}" th:value="${c.key}"
                                th:text="${c.label}" th:selected="${c.key == analogCategory}"></option>
                    </select>
                </div>
                <div>
                    <label for="analogTitle">Название для поиска</label>
                    <input id="analogTitle" name="title" th:value="${analogTitle}"
                           placeholder="игровая сборка ПК">
                </div>
                <div>
                    <label for="analogLimit">Сколько аналогов</label>
                    <input id="analogLimit" name="limit" type="number" min="1" max="10"
                           th:value="${analogLimit}">
                </div>
            </div>
            <label style="display:block;margin-top:12px">
                <input type="checkbox" name="web" value="true" th:checked="${analogWeb}">
                Искать в интернете (DuckDuckGo HTML). Без галочки — только демо-каталог.
            </label>
            <p style="margin-top:14px"><button type="submit">Найти и сравнить</button></p>
        </form>
        <p class="muted">Найденные карточки не добавляются в отслеживание: это разовый отчёт.
            Сравнение делит баллы за комплектацию на актуальную цену каждой карточки.</p>
    </div>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="card" th:if="${result != null}">
        <h2>Вердикт</h2>
        <p th:text="${result.verdict}"></p>
        <p class="muted" th:text="'Тема: ' + ${result.categoryLabel} + ' · источник: ' + ${result.source}"></p>

        <div th:if="${!result.warnings.isEmpty()}">
            <strong>Предупреждения:</strong>
            <ul>
                <li class="muted" th:each="warning : ${result.warnings}" th:text="${warning}"></li>
            </ul>
        </div>

        <h3>Карточки-аналоги</h3>
        <ul>
            <li th:each="item : ${result.items}">
                <a th:href="${item.url}" target="_blank" rel="noopener noreferrer"
                   th:text="${item.title}"></a>
                <span class="muted" th:text="' — ' + ${item.price} + ' ₽'"></span>
                <span class="badge ok" th:if="${item.productId == result.winnerId}">ЛУЧШЕЕ ЗА ЦЕНУ</span>
            </li>
        </ul>
    </div>

    <div class="card" th:if="${result != null}">
        <h2>Характеристики и цена</h2>
        <div th:replace="~{fragments/compare-table :: table(${result})}"></div>
    </div>
</main>
</body>
</html>
