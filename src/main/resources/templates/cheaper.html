<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Найти дешевле — PriceTracker</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main>
    <div th:replace="~{fragments/header :: header('Поиск дешевле')}"></div>

    <div class="card">
        <h2>Вставь ссылку на сборку — найдём дешевле</h2>
        <p class="muted">Ищем ту же или лучшую комплектацию в магазине из ссылки и, при включённом
            переключателе, в других магазинах. Демо-варианты добавляются, если сайты блокируют парсер.</p>
        <form method="get" th:action="@{/cheaper}">
            <div class="grid">
                <div>
                    <label for="cheaperUrl">URL товара</label>
                    <input id="cheaperUrl" name="url" type="url"
                           placeholder="https://www.dns-shop.ru/product/.../"
                           th:value="${cheaperUrl}" required>
                </div>
                <div>
                    <label for="cheaperCategory">Тема</label>
                    <select id="cheaperCategory" name="category">
                        <option th:each="c : ${categories}" th:value="${c.key}"
                                th:text="${c.label}" th:selected="${c.key == cheaperCategory}"></option>
                    </select>
                </div>
                <div>
                    <label for="cheaperTitle">Название/конфигурация (необязательно)</label>
                    <input id="cheaperTitle" name="title" th:value="${cheaperTitle}"
                           placeholder="Core i5 RTX 4070 32 ГБ">
                </div>
                <div>
                    <label for="cheaperLimit">Сколько предложений</label>
                    <input id="cheaperLimit" name="limit" type="number" min="1" max="10"
                           th:value="${cheaperLimit}">
                </div>
            </div>
            <div class="toolbar" style="margin-top:12px">
                <label class="inline-choice"><input type="radio" name="crossStore" value="true"
                                                    th:checked="${cheaperCrossStore}"> Искать во всех магазинах</label>
                <label class="inline-choice"><input type="radio" name="crossStore" value="false"
                                                    th:checked="${!cheaperCrossStore}"> Только магазин из ссылки</label>
            </div>
            <div class="form-actions"><button type="submit">Найти дешевле</button></div>
        </form>
    </div>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="card" th:if="${result != null}">
        <h2>Вердикт</h2>
        <p th:text="${result.verdict}"></p>
        <p class="muted"
           th:text="'Исходник: ' + ${result.sourceTitle} + ' — ' + ${result.sourcePrice} + ' ₽'
                   + ' · магазин: ' + ${result.store}
                   + ' · найдено карточек: ' + ${result.foundOffers}
                   + ' · отклонено: ' + ${result.rejectedOffers}"></p>

        <div class="source-chips">
            <span class="source-chip" th:each="attr : ${result.attributes}"
                  th:if="${result.sourceSpecs[attr.key] != null}"
                  th:text="${attr.icon} + ' ' + ${attr.label} + ': ' + ${result.sourceSpecs[attr.key]}"></span>
        </div>

        <div th:if="${!result.warnings.isEmpty()}">
            <strong>Предупреждения:</strong>
            <ul class="warning-list">
                <li class="muted" th:each="warning : ${result.warnings}" th:text="${warning}"></li>
            </ul>
        </div>

    </div>

    <div class="card" th:if="${result != null}">
        <h2>Сравнение комплектаций</h2>
        <div th:replace="~{fragments/compare-table :: table(${result})}"></div>
    </div>
</main>
</body>
</html>
