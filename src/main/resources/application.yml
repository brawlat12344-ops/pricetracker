spring:
  application:
    name: pricetracker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pricetracker}
    username: ${DATABASE_USER:ptuser}
    password: ${DATABASE_PASSWORD:ptpass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC
  flyway:
    enabled: false # миграции выполняет отдельный контейнер через MigrateRunner
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:120}

pricetracker:
  spec-provider: ${SPEC_PROVIDER:mock}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.pricetracker: INFO
