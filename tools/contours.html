<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>PriceTracker — генератор изолиний</title>
  <!-- Prefer the real p5.js noise(); the inline fallback keeps the page usable offline. -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <style>
    body { margin:0; background:#000; color:#e0e0e0; font:14px system-ui,sans-serif; padding:20px; }
    textarea { width:100%; height:60vh; background:#050505; color:#e0e0e0; border:1px solid #333; }
  </style>
</head>
<body>
<h1>Perlin + Marching Squares</h1>
<p>Чёрный фон, тонкие светлые изолинии. Вызови <code>generateSVG(w, h, z)</code> из консоли
   или используй кнопки ниже, чтобы скачать готовый SVG.</p>
<button id="wide">1920×1080</button>
<button id="tall">1080×1920</button>
<textarea id="out" readonly></textarea>

<script>
/* Improved Perlin noise (Ken Perlin), used only when p5.js is unavailable.
   The public API matches p5's noise(x, y, z) -> [0, 1]. */
(function () {
  function makePerlin(seed) {
    var s = seed >>> 0;
    function rand() { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }
    var base = Array.from({length: 256}, function (_, i) { return i; });
    for (var i = 255; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var tmp = base[i]; base[i] = base[j]; base[j] = tmp;
    }
    var perm = new Uint8Array(512);
    for (var k = 0; k < 512; k++) perm[k] = base[k & 255];
    function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    function lerp(a, b, t) { return a + t * (b - a); }
    function grad(h, x, y, z) {
      h &= 15;
      var u = h < 8 ? x : y;
      var v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
      return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
    }
    return function noise(x, y, z) {
      z = z || 0;
      var X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      var u = fade(x), v = fade(y), w = fade(z);
      var A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
      var B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
      var n = lerp(
        lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
             lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
             lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v),
        w);
      return Math.min(1, Math.max(0, (n + 1) / 2));
    };
  }

  if (typeof window.noise !== 'function') window.noise = makePerlin(20261126);
  if (typeof window.noiseSeed === 'function') window.noiseSeed(20261126);
  if (typeof window.noiseDetail === 'function') window.noiseDetail(4, 0.52);

  var CELL = 9;          // grid step in viewBox units: small enough for smooth curves
  var SCALE = 0.0018;    // larger blobs, smoothly flowing parallel isolines
  var STEP = 0.035;      // distance between contour levels -> nested "eyes"/"pools"

  function edgePoint(name, x, y, tl, tr, br, bl, t) {
    switch (name) {
      case 'T': return [x + CELL * (t - tl) / (tr - tl), y];
      case 'R': return [x + CELL, y + CELL * (t - tr) / (br - tr)];
      case 'B': return [x + CELL * (br - t) / (br - bl), y + CELL];
      default:  return [x, y + CELL * (tl - t) / (tl - bl)];
    }
  }

  /* Own Marching Squares implementation. Corners: TL=8, TR=4, BR=2, BL=1.
     Edge crossings are linearly interpolated, so contours never look jagged. */
  function segments(index, center, t) {
    switch (index) {
      case 1:  return [['L', 'B']];
      case 2:  return [['B', 'R']];
      case 3:  return [['L', 'R']];
      case 4:  return [['T', 'R']];
      case 5:  return center > t ? [['T', 'L'], ['R', 'B']] : [['T', 'R'], ['B', 'L']];
      case 6:  return [['T', 'B']];
      case 7:  return [['T', 'L']];
      case 8:  return [['T', 'L']];
      case 9:  return [['T', 'B']];
      case 10: return center > t ? [['T', 'R'], ['B', 'L']] : [['T', 'L'], ['R', 'B']];
      case 11: return [['T', 'R']];
      case 12: return [['L', 'R']];
      case 13: return [['B', 'R']];
      case 14: return [['L', 'B']];
      default: return [];
    }
  }

  function fmt(n) { return Math.round(n * 10) / 10; }

  window.generateSVG = function generateSVG(width, height, z) {
    width = width || 1080;
    height = height || 1920;
    z = typeof z === 'number' ? z : 0.37;

    var cols = Math.ceil(width / CELL) + 1;
    var rows = Math.ceil(height / CELL) + 1;
    var field = new Float32Array(cols * rows);
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        field[r * cols + c] = window.noise(c * CELL * SCALE, r * CELL * SCALE, z);
      }
    }

    var paths = [];
    for (var t = 0.24; t <= 0.761; t += STEP) {
      var d = '';
      for (var row = 0; row < rows - 1; row++) {
        for (var col = 0; col < cols - 1; col++) {
          var tl = field[row * cols + col];
          var tr = field[row * cols + col + 1];
          var br = field[(row + 1) * cols + col + 1];
          var bl = field[(row + 1) * cols + col];
          var index = 0;
          if (tl > t) index |= 8;
          if (tr > t) index |= 4;
          if (br > t) index |= 2;
          if (bl > t) index |= 1;
          if (index === 0 || index === 15) continue;

          var x = col * CELL, y = row * CELL;
          var center = (tl + tr + br + bl) / 4;
          var pairs = segments(index, center, t);
          for (var i = 0; i < pairs.length; i++) {
            var a = edgePoint(pairs[i][0], x, y, tl, tr, br, bl, t);
            var b = edgePoint(pairs[i][1], x, y, tl, tr, br, bl, t);
            d += 'M' + fmt(a[0]) + ' ' + fmt(a[1]) + 'L' + fmt(b[0]) + ' ' + fmt(b[1]);
          }
        }
      }
      if (d) paths.push('<path d="' + d + '"/>');
    }

    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + ' ' + height + '" ' +
      'preserveAspectRatio="xMidYMid slice">\n' +
      '  <rect width="100%" height="100%" fill="#000000"/>\n' +
      '  <g fill="none" stroke="#E0E0E0" stroke-width="1.2" stroke-linecap="round" ' +
      'stroke-linejoin="round" vector-effect="non-scaling-stroke">\n' +
      '    ' + paths.join('\n    ') + '\n' +
      '  </g>\n</svg>\n';
  };

  function download(name, svg) {
    var blob = new Blob([svg], {type: 'image/svg+xml'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  document.getElementById('wide').onclick = function () {
    var svg = generateSVG(1920, 1080, 0.37);
    document.getElementById('out').value = svg;
    download('contours-wide.svg', svg);
  };
  document.getElementById('tall').onclick = function () {
    var svg = generateSVG(1080, 1920, 0.71);
    document.getElementById('out').value = svg;
    download('contours-tall.svg', svg);
  };
})();
</script>
</body>
</html>
