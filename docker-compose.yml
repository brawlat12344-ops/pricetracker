name: pricetracker

services:
  db:
    build:
      context: .
      dockerfile: services/db/Dockerfile
    container_name: pt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricetracker}
      POSTGRES_USER: ${POSTGRES_USER:-ptuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ptuser} -d ${POSTGRES_DB:-pricetracker}" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [ appnet ]

  migrate:
    build:
      context: .
      dockerfile: services/migrate/Dockerfile
    container_name: pt-migrate
    restart: "no"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pricetracker}
      DATABASE_USER: ${POSTGRES_USER:-ptuser}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
    networks: [ appnet ]

  price:
    build:
      context: .
      dockerfile: services/price/Dockerfile
    container_name: pt-price
    restart: unless-stopped
    environment:
      BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-3}
      BREAKER_COOLDOWN_SECONDS: ${BREAKER_COOLDOWN_SECONDS:-60}
    ports:
      - "${PRICE_PORT:-8082}:8082"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8082/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [ appnet ]

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    container_name: pt-catalog
    restart: unless-stopped
    environment:
      PRICE_URL: http://price:8082
      SPEC_PROVIDER: ${SPEC_PROVIDER:-mock}
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-12}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-200}
      BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-3}
      BREAKER_COOLDOWN_SECONDS: ${BREAKER_COOLDOWN_SECONDS:-60}
    ports:
      - "${CATALOG_PORT:-8081}:8081"
    depends_on:
      price:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8081/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [ appnet ]

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: pt-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pricetracker}
      DATABASE_USER: ${POSTGRES_USER:-ptuser}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-120}
      CATALOG_URL: http://catalog:8081
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [ appnet ]

  nginx:
    build:
      context: .
      dockerfile: services/nginx/Dockerfile
    container_name: pt-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ appnet ]

networks:
  appnet:
    driver: bridge

volumes:
  db_data:
