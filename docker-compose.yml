name: pricetracker

services:
  db:
    build:
      context: .
      dockerfile: services/db/Dockerfile
    container_name: pt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricetracker}
      POSTGRES_USER: ${POSTGRES_USER:-ptuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ptuser} -d ${POSTGRES_DB:-pricetracker}" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [ appnet ]

  migrate:
    build:
      context: .
      dockerfile: services/migrate/Dockerfile
    container_name: pt-migrate
    restart: "no"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pricetracker}
      DATABASE_USER: ${POSTGRES_USER:-ptuser}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
    networks: [ appnet ]

  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
    container_name: pt-app
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pricetracker}
      DATABASE_USER: ${POSTGRES_USER:-ptuser}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-120}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-60000}
      PRICE_PROVIDER: ${PRICE_PROVIDER:-mock}
      SPEC_PROVIDER: ${SPEC_PROVIDER:-mock}
      MOCK_BASE_PRICE: ${MOCK_BASE_PRICE:-8990}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [ appnet ]

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: pt-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pricetracker}
      DATABASE_USER: ${POSTGRES_USER:-ptuser}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-60000}
      PRICE_PROVIDER: ${PRICE_PROVIDER:-mock}
      SPEC_PROVIDER: ${SPEC_PROVIDER:-mock}
      MOCK_BASE_PRICE: ${MOCK_BASE_PRICE:-8990}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [ appnet ]

  nginx:
    build:
      context: .
      dockerfile: services/nginx/Dockerfile
    container_name: pt-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ appnet ]

networks:
  appnet:
    driver: bridge

volumes:
  db_data:
