name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Maven tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn -B -ntp test

  smoke:
    name: Docker compose smoke
    runs-on: ubuntu-latest
    needs: tests
    env:
      POSTGRES_PASSWORD: ptpass
      JWT_SECRET: ci-secret-key-with-at-least-32-chars
      APP_PORT: 8083
      GATEWAY_PORT: 8084
      CATALOG_PORT: 8081
      PRICE_PORT: 8082
      BASE_URL: http://localhost:8083
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS "$BASE_URL/actuator/health" > health.json; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=120
          exit 1
      - name: Run smoke checks
        run: bash tools/smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=120
